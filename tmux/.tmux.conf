################### many prefix config is in the wezterm config!!!!!! ########################
# Catppuccin Mocha · 手写配色,无需插件

# ── 基础 ────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides "xterm-256color:Tc"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# ── 体验 QoL ────────────────────────────────────────────
set -sg escape-time 10        # vi-mode 切换无延迟
set -g focus-events on        # 让 nvim 等感知焦点(autoread/光标)
set -g history-limit 50000    # 更大的 copy-mode 滚动历史
set -g display-time 2000      # 状态消息停留 2s,看得清
set -g set-clipboard on       # y 直接进系统剪贴板(wezterm OSC52,SSH 也通)

# ── 按键 ────────────────────────────────────────────────
unbind C-b
set -g prefix C-p
bind -r o rotate-window

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ── 状态栏 ──────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left ' '
set -g status-left-length 0
set -g status-right '#[fg=#f9e2af] %a. %H:%M:%S  %b-%d-%Y '

# tab:普通=灰字;当前=黄底深字(catppuccin 高亮)
set -g window-status-style 'fg=#6c7086 bg=#1e1e2e'
set -g window-status-current-style 'fg=#1e1e2e bg=#f9e2af bold'
set -g window-status-separator ''
set -g window-status-format '#{?#{==:#{window_index},1},[1] ,#{?#{==:#{window_index},2},[2] ,#{?#{==:#{window_index},3},[3] ,#{?#{==:#{window_index},4},[4] ,#{?#{==:#{window_index},5},[5] ,#{?#{==:#{window_index},6},[6] ,#{?#{==:#{window_index},7},[7] ,#{?#{==:#{window_index},8},[8] ,#{?#{==:#{window_index},9},[9] ,[10] }}}}}}}}}#W#{?window_zoomed_flag, 󰁌 , }'
set -g window-status-current-format '#{?#{==:#{window_index},1},[1] ,#{?#{==:#{window_index},2},[2] ,#{?#{==:#{window_index},3},[3] ,#{?#{==:#{window_index},4},[4] ,#{?#{==:#{window_index},5},[5] ,#{?#{==:#{window_index},6},[6] ,#{?#{==:#{window_index},7},[7] ,#{?#{==:#{window_index},8},[8] ,#{?#{==:#{window_index},9},[9] ,[10] }}}}}}}}}#W#{?window_zoomed_flag, 󰁌 , }'
