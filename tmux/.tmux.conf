# ── 窗格 / 消息 ─────────────────────────────────────────
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#f9e2af'
set -g message-style 'fg=#1e1e2e bg=#f9e2af'

# 非活动窗格轻微变暗,让活动窗格更突出。
# 若 yazi 看图 / passthrough 出现底色异常,注释掉这两行即可:
# set -g window-style 'bg=#181825'
# set -g window-active-style 'bg=#1e1e2e'

# ── copy-mode 配色(Catppuccin Mocha)─────────────────────
set -g mode-style 'bg=#f9e2af fg=#1e1e2e'                          # 选区:暖黄底 + 深字(与 WezTerm/VSCode 统一)
set -g copy-mode-match-style 'bg=#45475a fg=#89dceb'               # 搜索·所有匹配:天蓝字
set -g copy-mode-current-match-style 'bg=#89dceb fg=#1e1e2e bold'  # 搜索·当前匹配:天蓝底,最醒目
set -g copy-mode-mark-style 'bg=#f38ba8 fg=#1e1e2e'                # 标记行:红
